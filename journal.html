<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asim | Pro Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            background: #050505;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }
        .pro-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            width: 300px;
            backdrop-filter: blur(20px);
        }
        .avatar {
            width: 80px; height: 80px;
            background: linear-gradient(45deg, #00d2ff, #92fe9d);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
        }
        h1 { font-size: 22px; margin: 10px 0; letter-spacing: 1px; }
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }
        .link-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.07);
            padding: 12px 20px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .link-item i {
            margin-left: 15px; /* مسافة للأيقونة لأن الموقع عربي */
            font-size: 20px;
            width: 25px;
        }
        .link-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.03);
            border-color: #00d2ff;
        }
        /* ألوان الأيقونات */
        .fa-tiktok { color: #ff0050; }
        .fa-youtube { color: #ff0000; }
        .fa-instagram { color: #e1306c; }
        .fa-github { color: #fff; }
    </style>
</head>
<body>

    <div class="pro-card">
        <div class="avatar">👨‍💻</div>
        <h1>عاصم الشلفي</h1>
        <p style="font-size: 12px; color: #888;">SOFTWARE DEVELOPER</p>

        <div class="links-grid">
            <a href="رابط_تيك_توك" class="link-item">
                <i class="fab fa-tiktok"></i>
                <span>تيك توك</span>
            </a>
            <a href="رابط_يوتيوب" class="link-item">
                <i class="fab fa-youtube"></i>
                <span>يوتيوب</span>
            </a>
            <a href="رابط_انستقرام" class="link-item">
                <i class="fab fa-instagram"></i>
                <span>إنستغرام</span>
            </a>
            <a href="https://github.com/asimcreativ300-rgb" class="link-item">
                <i class="fab fa-github"></i>
                <span>جيت هاب</span>
            </a>
        </div>
    </div>

</body>
</html>
